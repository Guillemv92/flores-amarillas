<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cartita para imprimir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "Fraunces", serif;
        color: #1d2b22;
        background: #1b3a2c;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .wrap { text-align: center; }
      .hint {
        max-width: 420px;
        margin: 0 auto 18px;
        color: #d7e3d4;
        line-height: 1.45;
        font-size: 0.95rem;
      }
      .card {
        width: 90mm;
        height: 55mm;
        margin: 0 auto;
        background: #fff6e3;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        overflow: hidden;
        box-shadow: 0 18px 32px rgba(0, 0, 0, 0.28);
      }
      .left {
        padding: 12px 14px;
        text-align: left;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .date {
        margin: 0;
        font-size: 11px;
        color: #4d6354;
      }
      h1 {
        margin: 4px 0 8px;
        font-size: 26px;
        font-weight: 700;
        line-height: 1;
      }
      .note {
        margin: 0;
        font-size: 11px;
        line-height: 1.35;
        color: #4d6354;
      }
      .right {
        display: grid;
        place-items: center;
        background: #f3e2b8;
        padding: 8px;
      }
      #qr { width: 38mm; height: 38mm; }
      #qr svg { width: 100%; height: 100%; }
      .actions { margin-top: 18px; }
      button {
        border: 0;
        background: #f6d03a;
        color: #1d2b22;
        font-family: inherit;
        font-weight: 700;
        padding: 10px 18px;
        cursor: pointer;
      }
      @media print {
        body { background: #fff; padding: 0; }
        .hint, .actions { display: none; }
        .card { box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="hint">
        Esta es la cartita física. Imprimila y recortala.
        El QR lleva a la dedicatoria. No le mandes esta página a ella.
      </p>
      <article class="card">
        <div class="left">
          <h1 id="title">Feliz primavera</h1>
          <p class="note">escaneá el QR</p>
        </div>
        <div class="right">
          <div id="qr"></div>
        </div>
      </article>
      <div class="actions">
        <button type="button" onclick="window.print()">imprimir cartita</button>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="config.js"></script>
    <script>
      const qr = qrcode(0, "H");
      qr.addData(LETTER_CONFIG.siteUrl);
      qr.make();
      document.getElementById("qr").innerHTML = qr.createSvgTag(0, 4);
    </script>
  </body>
</html>
